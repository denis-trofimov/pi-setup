# Секреты в этом репозитории. Схема взята из
# product-ai-development-course: базовый набор gitleaks плюс правила на ключи, которые
# базовый набор не видит.
#
# Зачем свои правила: `generic-api-key` из базового набора срабатывает на *имя* переменной
# (`ROUTERAI_API_KEY=…`), а не на форму ключа. Ключ, приехавший в скилле, в README или в
# сообщении коммита отдельной строкой, он пропускает — ровно поэтому в курсе появились
# правила на langfuse. Здесь то же самое для провайдеров, на которых работает этот харнесс.
#
# Конфиг подхватывают оба гейта: хук `gitleaks` из `prek.toml` (gitleaks читает
# `.gitleaks.toml` из корня репозитория) и job `secrets` в `.github/workflows/ci.yml`
# (передаёт `--config .gitleaks.toml` явно). Версия gitleaks у хука и в CI одна.

title = "pi-setup"

[extend]
useDefault = true

[[rules]]
id = "routerai-api-key"
description = "RouterAI API key (sk-jj…)"
regex = '''sk-jj[0-9A-Za-z_-]{16,}'''
keywords = ["sk-jj"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key (sk-or-v1-…)"
regex = '''sk-or-v1-[0-9A-Za-z]{32,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-api03-…)"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[0-9A-Za-z_-]{80,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face token (hf_…)"
regex = '''hf_[0-9A-Za-z]{34,}'''
keywords = ["hf_"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub fine-grained PAT (github_pat_…)"
regex = '''github_pat_[0-9A-Za-z_]{60,}'''
keywords = ["github_pat_"]

[[rules]]
id = "langfuse-public-key"
description = "Langfuse public API key or truncated hex prefix (pk-lf-…)"
# Полный UUID или короткий отладочный префикс, который печатают как «PK prefix pk-lf-…».
regex = '''pk-lf-[0-9a-fA-F]{4,}(?:-[0-9a-fA-F]{4,})*'''
keywords = ["pk-lf-"]

[[rules]]
id = "langfuse-secret-key"
description = "Langfuse secret API key or truncated hex prefix (sk-lf-…)"
regex = '''sk-lf-[0-9a-fA-F]{4,}(?:-[0-9a-fA-F]{4,})*'''
keywords = ["sk-lf-"]

# Красные плашки в документации и в журналах сессий — не секрет. Список только на эти
# литералы: расширять его до «любой ключ, похожий на вымаранный» значит выключить правило.
[allowlist]
description = "Scrubbed placeholders in docs and session logs"
regexTarget = "match"
regexes = [
  '''(?:pk|sk)-lf-REDACTED''',
  '''sk-jj-REDACTED''',
  '''sk-or-v1-REDACTED''',
]
