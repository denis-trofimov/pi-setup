# Хуки этого репозитория. Ставит их `install.sh` (`prek install`), прогоняет prek — тот же
# инструмент, что в рабочих репозиториях.
#
# Секреты — второй гейт: репозиторий целиком состоит из конфигов, где ключ провайдера живёт
# одной строкой. `gitleaks` читает `.gitleaks.toml` из корня сам; rev держать в синхроне с
# GITLEAKS_VERSION в `.github/workflows/ci.yml`.
#
# Механически здесь гейтятся только политика и секреты: скрипты проверяются `tests/*.sh`,
# расширения — `node --test`, а формат и импорты в этом репозитории не линтятся вовсе.
# Первым появился гейт на deny-список: он — политика, а не код, и его нельзя править
# изнутри сессии, которая им же и проверяется (#15820).

# Два базовых хука нужны не только сами по себе: `SKIP=deny-list-guard` в prek 0.4.3 фильтрует хуки
# до запуска, и если после фильтра не осталось ни одного, prek падает с «No hooks found after
# filtering» — то есть документированный обход переставал бы работать. С базовыми хуками обход
# оставляет что запускать.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], priority = 10 },
  { id = "end-of-file-fixer", priority = 10 },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
# Комментарий в конфиге дублировать незачем: `.gitleaks.toml` найден от корня репозитория.
# Красный на находке — цель хука, обход `SKIP=gitleaks git commit …` в prek штатный.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "deny-list-guard"
name = "ru-spellcheck: deny-список не правится агентом молча (#15820)"
language = "system"
# prek исполняет entry без шелла, поэтому интерпретатор назван явно.
entry = "bash scripts/prek/deny-list-guard.sh"
# Хук запускается только когда в индексе есть этот файл; пути приходят аргументами.
files = "^config/ru-spellcheck/deny\\.txt$"
pass_filenames = true

[[repos.hooks]]
id = "deny-words-in-steering"
name = "канон: слова из deny-списка ru-spellcheck (#16159)"
language = "system"
# Список — тот же файл, что читает ru-spellcheck (`config/ru-spellcheck/deny.txt`); второго перечня нет.
# Хук смотрит прозу канона, а блоки кода маскирует: там запрещённые слова стоят примерами.
entry = "python3 scripts/prek/deny-words-in-steering.py"
# Пути не передаются: канон маленький (около 40 файлов), а `--root` нужен только тестам.
files = "^(config/AGENTS\\.md|skills/.*\\.md)$"
pass_filenames = false

[[repos.hooks]]
id = "skill-tool-refs"
name = "скиллы: никакого «Skill tool», только чтение SKILL.md"
language = "system"
entry = "bash scripts/prek/skill-tool-refs.sh"
# Указатель может сломать и правка скилла, и удаление соседа, поэтому хук смотрит весь набор: он
# быстрый (grep по 37 файлам), а частичный запуск пропустил бы битую ссылку в непереименованном файле.
files = "^skills/.*SKILL\\.md$"
pass_filenames = false
